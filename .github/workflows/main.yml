name: Amazon Job Bot

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Debug - list files
        run: |
          echo "CHECKING FILES"
          ls -la

      - name: Run Python file
        run: |
          echo "RUNNING PYTHON NOW"
          python3 main.py
